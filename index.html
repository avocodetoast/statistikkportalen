<!DOCTYPE html>
<html lang="no" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Statistikkportalen</title>
  <meta name="description" content="Et uoffisielt verktøy for bedre tilgang til åpne statistikkdata fra SSB, Norges Bank og FHI." id="meta-description">
  <link rel="canonical" href="https://statistikkportalen.no/">
  <meta property="og:title" content="Statistikkportalen">
  <meta property="og:description" content="Et uoffisielt verktøy for bedre tilgang til åpne statistikkdata fra SSB, Norges Bank og FHI.">
  <meta property="og:url" content="https://statistikkportalen.no/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Statistikkportalen">
  <meta property="og:locale" content="nb_NO">

  <!-- Uten JavaScript: skjul JS-avhengige småelementer (footer-lenker o.l.) -->
  <noscript><style>.js-only { display: none !important; }</style></noscript>

  <!-- Analytics injiseres fra AppConfig.analytics (se js/config.js) rett etter
       config.js er lastet nederst i <body>. -->

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css?v=1.9.4">
  <link rel="stylesheet" href="css/table.css?v=1.9.4">
  <link rel="stylesheet" href="css/menu-navigator.css?v=1.9.4">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="header-content">
      <h1><a href="#home" id="header-home-link">Statistikkportalen</a></h1>
      <p class="subtitle" id="header-subtitle">Et uoffisielt verktøy som gir deg bedre tilgang til åpne data fra SSB, Norges Bank og FHI.</p>
    </div>
    <div class="header-tools">
      <button id="api-status-badge" class="api-status-badge js-only" type="button" hidden></button>
      <div class="header-lang" id="header-lang"></div>
    </div>
  </header>

  <!-- Main Application -->
  <main id="app">
    <noscript>
      <!-- Emneoversikten finnes bare på sider generert av
           scripts/generate-seo-pages.mjs (statisk innhold i #content) —
           lov derfor ikke innhold rå index.html ikke har. -->
      <p class="noscript-notice">Søk og interaktiv tabellvisning krever JavaScript. Eventuell emneoversikt nedenfor kan brukes uten.</p>
    </noscript>

    <!-- Loading Indicator -->
    <div id="loading-indicator" style="display: none;">
      Laster...
    </div>

    <!-- Error Display -->
    <div id="error-display"></div>

    <!-- Dynamic Content Area -->
    <div id="content">
      <p>Initialiserer...</p>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <!-- Statisk kildeliste for crawlere/noscript; bygges om fra
         AppConfig.sources ved oppstart og språkbytte (applyTranslatableUI). -->
    <p id="footer-source-line"><span id="footer-data-from">Data fra</span>
    <span id="footer-sources"><a href="https://www.ssb.no/" target="_blank" rel="noopener noreferrer">Statistisk sentralbyrå</a> <a href="https://www.ssb.no/diverse/lisens" target="_blank" rel="noopener noreferrer">(CC BY 4.0)</a>, <a href="https://www.norges-bank.no/" target="_blank" rel="noopener noreferrer">Norges Bank</a> og <a href="https://www.fhi.no/" target="_blank" rel="noopener noreferrer">Folkehelseinstituttet</a> <a href="https://creativecommons.org/licenses/by/4.0/deed.no" target="_blank" rel="noopener noreferrer">(CC BY 4.0)</a></span>
    <span class="footer-separator">·</span>
    <a href="https://github.com/avocodetoast/statistikkportalen" target="_blank" rel="noopener noreferrer">GitHub</a>
    <span class="footer-separator js-only">·</span>
    <a href="#" id="clear-cache-link" class="js-only"></a>
    <span class="footer-separator js-only">·</span>
    <span id="app-version" class="js-only"></span></p>
  </footer>

  <!-- JavaScript - Load in correct order -->
  <!-- Cache busting: ?v= must match VERSION in version.js. When bumping VERSION, update all ?v= here too. -->
  <script src="js/version.js"></script>
  <!-- Kildedata skilt ut fra config.js — må lastes FØR config.js, som refererer
       window.NbCatalog / window.SourceTopology. Rene browser-globals uten deps. -->
  <script src="js/sources/nb-catalog.js?v=1.9.4"></script>
  <script src="js/sources/source-topology.js?v=1.9.4"></script>
  <script src="js/config.js?v=1.9.4"></script>

  <!-- Analytics: injiser Umami-scriptet fra AppConfig.analytics. Slås av
       ved å sette analytics til null (eller tomt scriptUrl/websiteId) i config.js. -->
  <script>
    (function () {
      var a = (window.AppConfig && window.AppConfig.analytics) || null;
      if (!a || !a.scriptUrl || !a.websiteId) return;
      var s = document.createElement('script');
      s.defer = true;
      s.src = a.scriptUrl;
      s.setAttribute('data-website-id', a.websiteId);
      if (a.domains) s.setAttribute('data-domains', a.domains);
      if (a.doNotTrack) s.setAttribute('data-do-not-track', 'true');
      document.head.appendChild(s);
    })();
  </script>

  <script src="js/translations.js?v=1.9.4"></script>
  <script src="js/cache.js?v=1.9.4"></script>
  <script src="js/api.js?v=1.9.4"></script>
  <!-- Kildeadaptere + fasade (Statistikkportalen 2.0). Lastes etter api.js
       (trenger window.SSBApi/window.api) og før browser-state.js (bruker api).
       source-registry.js laster SIST og erstatter window.api med fasaden. -->
  <!-- FHI-katalogen (titler/perioder, bygget av scripts/update-fhi-catalog.mjs)
       som browser-global. MÅ lastes som <script>, ikke fetch(): åpnes appen
       rett fra disk (file://) blokkerer nettleseren fetch() av lokale filer,
       og da faller alle FHI-tabeller tilbake til interne kodenavn med tomme
       periodekolonner. fhi-adapter.js foretrekker window.FhiCatalog og faller
       tilbake til å hente .json-fila. -->
  <script src="data/sources/fhi-catalog.js?v=1.9.4"></script>
  <!-- Norges Bank-katalogens tidsperioder (bygget av
       scripts/update-nb-periods.mjs). Samme begrunnelse som over: uten dette
       måtte adapteren probet hver katalograd ved hver sidelasting (31 kall).
       norges-bank-adapter.js leser window.NbPeriods og degraderer til tomme
       periodekolonner om fila mangler. -->
  <script src="data/sources/nb-periods.js?v=1.9.4"></script>
  <script src="js/sources/sdmx-to-jsonstat.js?v=1.9.4"></script>
  <script src="js/sources/source-common.js?v=1.9.4"></script>
  <script src="js/sources/norges-bank-adapter.js?v=1.9.4"></script>
  <script src="js/sources/fhi-adapter.js?v=1.9.4"></script>
  <script src="js/sources/ssb-adapter.js?v=1.9.4"></script>
  <script src="js/sources/source-registry.js?v=1.9.4"></script>
  <script src="js/utils.js?v=1.9.4"></script>
  <script src="js/router.js?v=1.9.4"></script>
  <script src="js/seo-head.js?v=1.9.4"></script>
  <script src="js/subjects.js?v=1.9.4"></script>
  <script src="js/menu-hierarchy.js?v=1.9.4"></script>
  <script src="js/browser-state.js?v=1.9.4"></script>
  <script src="js/menu-bar.js?v=1.9.4"></script>
  <script src="js/front-page.js?v=1.9.4"></script>
  <script src="js/source-status.js?v=1.9.4"></script>
  <script src="js/synonyms.js?v=1.9.4"></script>
  <script src="js/search-enhanced.js?v=1.9.4"></script>
  <script src="js/search-view.js?v=1.9.4"></script>
  <script src="js/topic-view.js?v=1.9.4"></script>
  <script src="js/variable-select-state.js?v=1.9.4"></script>
  <script src="js/variable-select-status.js?v=1.9.4"></script>
  <script src="js/variable-select-codelists.js?v=1.9.4"></script>
  <script src="js/variable-select-render.js?v=1.9.4"></script>
  <script src="js/variable-select-events.js?v=1.9.4"></script>
  <script src="js/variable-select-api.js?v=1.9.4"></script>
  <script src="js/variable-select.js?v=1.9.4"></script>
  <script src="js/table-display.js?v=1.9.4"></script>
  <script src="js/table-metadata.js?v=1.9.4"></script>
  <script src="js/table-save-query.js?v=1.9.4"></script>
  <script src="js/table-rotation.js?v=1.9.4"></script>
  <script src="js/export.js?v=1.9.4"></script>

  <!-- Application Initialization -->
  <script>
    // Re-applies all language-sensitive static UI strings (tagline, footer).
    // Called on init and whenever the language is switched.
    function applyTranslatableUI() {
      const rawTagline = AppConfig.app?.tagline || '';
      const appTagline = (typeof rawTagline === 'object')
        ? (rawTagline[currentLanguage] ?? rawTagline['nb'] ?? '')
        : rawTagline;

      // Pre-rendrede SEO-sider (se scripts/generate-seo-pages.mjs) har en unik
      // beskrivelse som må bevares i Googlebots rendrede snapshot.
      if (!window.__SEO_TOPIC_PATH__ && !window.__SEO_TABLE_ID__) {
        document.getElementById('meta-description').setAttribute('content', appTagline);
      }
      document.getElementById('header-subtitle').textContent = appTagline;

      const dataFromEl = document.getElementById('footer-data-from');
      if (dataFromEl) dataFromEl.textContent = t('footer.dataFrom');

      // Kildeliste i footeren: én lenke (+ evt. lisenslenke) per aktivert
      // kilde, fra AppConfig.sources/AppConfig.source (listSourceBrandings i
      // utils.js). Bindeordet («og»/«and») følger språket.
      const sourcesEl = document.getElementById('footer-sources');
      if (sourcesEl) {
        const items = listSourceBrandings().map(src => {
          const name = escapeHtml(src.nameFull || src.name || src.url || '');
          let html = src.url
            ? `<a href="${escapeHtml(src.url)}" target="_blank" rel="noopener noreferrer">${name}</a>`
            : name;
          if (src.licenseUrl) {
            html += ` <a href="${escapeHtml(src.licenseUrl)}" target="_blank" rel="noopener noreferrer">(${escapeHtml(src.licenseName || 'License')})</a>`;
          } else if (src.licenseName) {
            html += ` (${escapeHtml(src.licenseName)})`;
          }
          return html;
        });
        sourcesEl.innerHTML = items.length > 1
          ? items.slice(0, -1).join(', ') + ' ' + escapeHtml(t('footer.and')) + ' ' + items[items.length - 1]
          : items.join('');
      }

      const clearLink = document.getElementById('clear-cache-link');
      if (clearLink) {
        clearLink.textContent = t('cache.clear');
        clearLink.title = t('cache.clearTooltip');
      }

      // API-statusbadgen (tekst/farge følger språket og gjeldende status)
      if (window.SourceStatusUI) SourceStatusUI.refresh();
    }

    // Initialize app when DOM is ready
    document.addEventListener('DOMContentLoaded', () => {
      // Apply instance-specific branding from AppConfig
      const appName = AppConfig.app?.name || 'Statistikkportalen';

      // Pre-rendrede SEO-sider har en unik tittel som ikke skal overskrives
      // med den generiske (updatePageTitle setter emnespesifikk tittel senere).
      if (!window.__SEO_TOPIC_PATH__ && !window.__SEO_TABLE_ID__) {
        document.title = appName;
      }
      document.getElementById('header-home-link').textContent = appName;

      // Footer-kildelisten bygges i applyTranslatableUI (flerkildestøtte).
      applyTranslatableUI();

      // API-statusbadge + statuspanel (abonnerer på fasadens kildestatus)
      SourceStatusUI.init();

      // Language selector
      const langContainer = document.getElementById('header-lang');
      const langs = AppConfig.languages || [];
      if (langs.length > 1 && langContainer) {
        langContainer.setAttribute('role', 'group');
        langContainer.setAttribute('aria-label', t('lang.label'));
        langs.forEach(lang => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'lang-btn' + (lang.code === currentLanguage ? ' lang-active' : '');
          btn.textContent = lang.label;
          btn.setAttribute('aria-pressed', lang.code === currentLanguage ? 'true' : 'false');
          btn.addEventListener('click', () => {
            setLanguage(lang.code);
            applyTranslatableUI();
            langContainer.querySelectorAll('.lang-btn').forEach(b => {
              b.classList.remove('lang-active');
              b.setAttribute('aria-pressed', 'false');
            });
            btn.classList.add('lang-active');
            btn.setAttribute('aria-pressed', 'true');
          });
          langContainer.appendChild(btn);
        });
      }

      // Set HTML lang attribute
      document.getElementById('html-root').lang =
        (AppConfig.languages || []).find(l => l.code === currentLanguage)?.apiLang || 'no';

      document.getElementById('app-version').textContent = VERSION;
      logger.log('[App] Initializing', appName);
      logger.log('[App] API Base URL:', api.baseUrl);

      // Cleanup expired cache entries on startup
      const removed = api.cleanupCache();
      if (removed > 0) {
        logger.log('[App] Cleaned up ' + removed + ' expired cache entries');
      }

      // Log cache stats
      const stats = api.getCacheStats();
      if (stats) {
        logger.log('[App] Cache stats:', stats);
      }

      // Handle browser back/forward navigation
      window.addEventListener('popstate', handleHashChange);

      // Header logo click → navigate to front page
      document.getElementById('header-home-link')?.addEventListener('click', (e) => {
        e.preventDefault();
        URLRouter.navigateTo('home', {});
        URLRouter.handleRoute();
      });

      // Manual cache clear
      document.getElementById('clear-cache-link')?.addEventListener('click', async (e) => {
        e.preventDefault();
        await api.clearCache();
        logger.log('[App] Cache cleared by user');
        window.location.reload();
      });

      // SEO: pre-rendrede sider ligger på /<slug>/.../ (emner) eller /table/{id}/
      // (tabeller) og embedder ruten sin i window.__SEO_TOPIC_PATH__ /
      // window.__SEO_TABLE_ID__ (se scripts/generate-seo-pages.mjs).
      // Normaliser til kanonisk hash-URL uten omlasting. Kjører bare på sider
      // som faktisk er pre-rendret — vanlig index.html (inkl. åpnet via file://,
      // der replaceState til '/' kaster SecurityError) berøres ikke.
      const seoPath = window.__SEO_TOPIC_PATH__;
      const seoTable = window.__SEO_TABLE_ID__;
      let seoTargetHash = null;
      if (Array.isArray(seoPath) && seoPath.length) {
        seoTargetHash = '#topic/' + seoPath.join('/');
      } else if (seoTable) {
        seoTargetHash = '#variables/' + seoTable;
      }
      if (seoTargetHash && window.location.pathname !== '/') {
        const seoHash = (window.location.hash && window.location.hash !== '#')
          ? window.location.hash
          : seoTargetHash;
        try {
          history.replaceState(null, '', '/' + seoHash);
        } catch (e) {
          // Uventet miljø (f.eks. file:) — fortsett uten URL-normalisering
          logger.warn('[App] Kunne ikke normalisere SEO-URL:', e);
          window.location.hash = seoHash;
        }
      }

      // Route based on current URL hash
      if (window.location.hash && window.location.hash !== '#') {
        URLRouter.handleRoute();
      } else {
        // Default to front page
        AppState.currentView = 'home';
        renderCurrentView();
      }
    });

    // Expose debug helpers only when debug mode is on
    if (AppConfig.debug) {
      window.AppState = AppState;
      window.BrowserState = BrowserState;
      window.api = api;
    }
    window.clearCache = () => {
      api.clearCache();
      logger.log('[App] API cache cleared');
    };
  </script>
</body>
</html>
