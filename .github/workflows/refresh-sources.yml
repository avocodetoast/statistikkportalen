# Ukentlig oppdatering av byggetids-kildedataene, og deretter utrulling til
# produksjon.
#
# Dette er steg 1-2 i byggekjeden (README.md → «Byggekjeden»). Filene er små,
# sporede tekstfiler, så de committes tilbake til git: da er git fasit, og en
# senere kodeutrulling kan aldri rsynce en eldre katalog over en nyere.
# Serveren commiterer aldri noe — det er runneren som pusher.
#
# Steg 3-4 (katalogindeks + SEO-sider) skjer i deploy.yml, som kalles til slutt.

name: Oppdater kildedata

on:
  schedule:
    # Natt til søndag, 04:15 UTC.
    - cron: '15 4 * * 0'
  workflow_dispatch:
    inputs:
      full:
        description: >-
          Full regenerering av FHI-katalogen i stedet for inkrementell
          (~740 kall, ~6 min). Fanger endringer FHI ikke har markert i modifiedAt.
        type: boolean
        default: false
      deploy_staging:
        description: Rull ut til staging etterpå
        type: boolean
        default: true
      deploy_production:
        description: Rull ut til produksjon etterpå
        type: boolean
        default: false

concurrency:
  group: refresh-sources
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  oppdater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # Inkrementelt som standard: ~30 kall i en normal uke (henter kun tabeller
      # som er nye eller endret siden katalogens generatedAt). En full runde er
      # ~740 kall og kjøres kun når «full» er huket av manuelt — den fanger
      # endringer FHI ikke har markert i modifiedAt, typisk omskrevne
      # metadata-sammendrag som tittel-heuristikken utleder titler fra.
      #
      # 120 kall/min (2/sek) — FHI dokumenterer ingen grense, så takten er satt
      # konservativt med vilje.
      - name: FHI-katalog
        id: fhi
        continue-on-error: true
        env:
          FULL: ${{ inputs.full }}
        run: |
          if [ "$FULL" = "true" ]; then
            echo "Full regenerering (~740 kall, ~6 min på 120/min)."
            node scripts/update-fhi-catalog.mjs --rate 120
          else
            node scripts/update-fhi-catalog.mjs --incremental --rate 120
          fi

      # ~31 sekvensielle prober à 250 ms mot data.norges-bank.no.
      - name: Norges Bank-perioder
        id: nb
        continue-on-error: true
        run: node scripts/update-nb-periods.mjs

      # En feilet fremmedkilde skal ikke stoppe utrullingen: byggeren er
      # feilisolert per kilde og bærer forrige shard videre.
      - name: Advar om feilede kilder
        if: steps.fhi.outcome == 'failure' || steps.nb.outcome == 'failure'
        env:
          FHI_OUTCOME: ${{ steps.fhi.outcome }}
          NB_OUTCOME: ${{ steps.nb.outcome }}
        run: |
          if [ "$FHI_OUTCOME" = "failure" ]; then
            echo "::warning::FHI-katalogen ble ikke oppdatert — forrige shard bæres videre."
          fi
          if [ "$NB_OUTCOME" = "failure" ]; then
            echo "::warning::NB-periodene ble ikke oppdatert — forrige shard bæres videre."
          fi

      # lastFullBuildAt arves i det uendelige under --incremental, så uten et
      # signal her ville ingen noen gang fått vite at det er på tide å huke av
      # «full». 90 dager er valgt fordi FHI-tabeller endrer struktur sjelden.
      - name: Sjekk alderen på siste fulle FHI-build
        run: |
          read -r last days <<< "$(node -e '
            const c = JSON.parse(require("fs").readFileSync("data/sources/fhi-catalog.json", "utf8"));
            const last = c.lastFullBuildAt || c.generatedAt;
            process.stdout.write(last + " " + Math.round((Date.now() - Date.parse(last)) / 86400000));
          ')"
          echo "Siste fulle FHI-build: $last ($days dager siden)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$days" -gt 90 ]; then
            echo "::warning::FHI-katalogen har ikke hatt en full regenerering på $days dager — kjør denne workflowen manuelt med «full» huket av."
          fi

      - name: Commit endringer
        run: |
          if git diff --quiet -- data/sources/; then
            echo "Ingen endring i data/sources/ — ingenting å committe."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/sources/fhi-catalog.json data/sources/nb-periods.json
          git commit -m 'Kildedata: ukentlig oppdatering av FHI-katalog og NB-perioder'
          git push
          git --no-pager show --stat --oneline HEAD >> "$GITHUB_STEP_SUMMARY"

  # Begge utrullingene kjøres også når ingenting ble committet: SSB-katalogen
  # endrer seg uavhengig av data/sources/, og det er denne utrullingen som
  # holder indeksen fersk (statusbadgen blir gul etter 48 timer).
  #
  # De kjører parallelt og er uavhengige — feiler staging, ruller produksjon
  # ut likevel hvis du har huket av for den.
  #
  # På en schedulert kjøring er inputs tomme. Da faller staging tilbake på å
  # kjøre, mens produksjon IKKE gjør det: en automatisk jobb skal aldri kunne
  # treffe produksjon uten at noen har bedt om det.
  deploy-staging:
    needs: oppdater
    if: ${{ inputs.deploy_staging || github.event_name == 'schedule' }}
    uses: ./.github/workflows/deploy.yml
    with:
      target: staging
      rebuild_index: true
    secrets: inherit

  deploy-production:
    needs: oppdater
    if: ${{ inputs.deploy_production }}
    uses: ./.github/workflows/deploy.yml
    with:
      target: production
      rebuild_index: true
    secrets: inherit
